name: Bug Report
about: File a bug report
title: "[BUG] "
labels: "bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        
        Please ensure you have searched for existing issues to avoid duplicates.
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of TikTokExplode are you running?
      placeholder: e.g., 1.4.7
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Please provide your OS and .NET version
      placeholder: e.g., Windows 10, .NET 9.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How to reproduce the issue
      placeholder: "1. ...\n2. ...\n3. ..."
      value: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional Details
      description: Any additional information, logs, or context
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for similar issues
          required: true
        - label: I am using the latest version
          required: true
        - label: I have provided a link to a TikTok video for reproduction
          required: true
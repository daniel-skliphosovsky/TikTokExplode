name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        run: |
          dotnet publish src/TikTokExplode/TikTokExplode.csproj -c Release -o publish
          dll_count=$(find publish -maxdepth 1 -name '*.dll' | wc -l | tr -d ' ')
          echo "dll files in publish: $dll_count"
          if [ "$dll_count" -ne 1 ]; then
            echo "Expected exactly 1 dll in publish, found $dll_count"
            exit 1
          fi
          ls -la publish

      - name: Delete previous release/tag
        run: gh release delete v1.4.4 --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.4
          files: publish/TikTokExplode.dll
          generate_release_notes: true

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Get version from csproj
        id: version
        run: |
          VERSION=$(sed -n 's/.*<VersionPrefix>\([^<]*\)<\/VersionPrefix>.*/\1/p' src/TikTokExplode/TikTokExplode.csproj)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: |
          dotnet publish src/TikTokExplode/TikTokExplode.csproj -c Release -o publish
          dll_count=$(find publish -maxdepth 1 -name '*.dll' | wc -l | tr -d ' ')
          echo "dll files in publish: $dll_count"
          if [ "$dll_count" -ne 1 ]; then
            echo "Expected exactly 1 dll in publish, found $dll_count"
            exit 1
          fi
          ls -la publish

      - name: Delete previous release/tag
        run: gh release delete v${{ steps.version.outputs.version }} --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: publish/TikTokExplode.dll
          generate_release_notes: true

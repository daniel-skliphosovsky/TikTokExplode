name: CD - NuGet Release

on:
  release:
    types: [published]

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true

      - name: Restore dependencies
        run: dotnet restore TikTokExplode.sln

      - name: Build
        run: dotnet build TikTokExplode.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test TikTokExplode.sln --no-build --configuration Release --verbosity normal

      - name: Pack NuGet package
        run: dotnet pack src/TikTokExplode/TikTokExplode.csproj --no-build --no-restore --configuration Release --output ./artifacts /p:Version=${{ github.event.release.tag_name }}

      - name: Push to NuGet.org
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
